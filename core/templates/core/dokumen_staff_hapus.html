{% extends 'authentication/base.html' %}
{% block title %}Hapus Dokumen Staff{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <div class="card border-danger">
      <div class="card-body text-center p-5">
        <div class="mb-3">
          <i class="bi bi-trash3-fill text-danger" style="font-size: 3rem;"></i>
        </div>
        <h5 class="fw-bold text-danger mb-2">Hapus Dokumen Staff?</h5>
        <p class="text-muted mb-1">Anda akan menghapus:</p>
        <p class="fw-semibold">{{ dokumen.judul_dokumen }}</p>
        <p class="text-muted small">Tindakan ini tidak dapat dibatalkan.</p>
        <form method="post" class="d-flex justify-content-center gap-3 mt-4">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger px-4">Ya, Hapus</button>
          <a href="{% url 'doc_staff' %}" class="btn btn-outline-secondary px-4">Batal</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
